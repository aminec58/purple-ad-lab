name: Custom.PurpleLab.PasswordSpray
description: |
  Sources ayant échoué à s'authentifier sur plusieurs comptes distincts
  (4625 NTLM / 4771 Kerberos) - MITRE T1110.003.
type: CLIENT
parameters:
  - name: MinUsers
    type: int
    default: 4
sources:
  - precondition: SELECT OS FROM info() WHERE OS = 'windows'
    query: |
      LET fails = SELECT System.TimeCreated.SystemTime AS Epoch,
                         System.EventID.Value AS EventID,
                         EventData.TargetUserName AS User,
                         regex_replace(source=EventData.IpAddress, re="^::ffff:", replace="") AS SrcIP,
                         format(format="%v|%v", args=[
                           regex_replace(source=EventData.IpAddress, re="^::ffff:", replace=""),
                           EventData.TargetUserName]) AS Key
        FROM parse_evtx(filename=expand(path="%SystemRoot%/System32/winevt/Logs/Security.evtx"))
        WHERE System.EventID.Value = 4625 OR System.EventID.Value = 4771

      LET per_user = SELECT SrcIP, User, count() AS N,
                            min(item=Epoch) AS First, max(item=Epoch) AS Last
        FROM fails GROUP BY Key

      LET per_ip = SELECT SrcIP, count() AS DistinctUsers, sum(item=N) AS Failures,
                          enumerate(items=User) AS Users,
                          min(item=First) AS First, max(item=Last) AS Last
        FROM per_user GROUP BY SrcIP

      SELECT SrcIP, DistinctUsers, Failures, Users,
             timestamp(epoch=First) AS FirstSeen,
             timestamp(epoch=Last) AS LastSeen
      FROM per_ip WHERE DistinctUsers >= MinUsers
