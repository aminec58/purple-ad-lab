title: Password spraying - une source, plusieurs comptes
id: 6f1c2a34-8b7d-4e55-9c10-5a2d7e3b1f02
status: experimental
description: Une même adresse IP échoue à s'authentifier sur plusieurs comptes distincts en 5 minutes.
author: Amine Cherif
date: 2026-11-11
correlation:
  type: value_count
  rules:
    - failed_logon
  group-by:
    - IpAddress
  timespan: 5m
  condition:
    field: TargetUserName
    gte: 4
falsepositives:
  - Passerelle NAT, proxy d'authentification ou serveur applicatif relayant de nombreux utilisateurs
level: high
tags:
  - attack.credential-access
  - attack.t1110.003
