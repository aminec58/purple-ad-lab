title: Kerberoasting - ticket demande pour le compte SPN leurre
id: 9e4a7b52-1d3c-4f80-b6e2-5c7a0d9f4e18
status: experimental
description: |
  Le compte svc-mssql-legacy porte un SPN mais aucun service reel ne l'utilise.
  Toute demande de ticket pour ce compte est suspecte, quel que soit le chiffrement.
references:
  - https://attack.mitre.org/techniques/T1558/003/
author: aminec58
date: 2026-11-12
tags:
  - attack.credential-access
  - attack.t1558.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    ServiceName: 'svc-mssql-legacy'
  condition: selection
falsepositives:
  - Aucun attendu
level: critical
